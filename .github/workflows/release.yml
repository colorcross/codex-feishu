name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.2. Manual dispatch refreshes GitHub Release assets only.'
        required: true
        type: string
      publish_npm:
        description: 'Also publish the selected tag to npm.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve ref
        id: ref
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$INPUT_TAG" in
              v*) ;;
              *)
                echo "manual release tag must start with v: $INPUT_TAG" >&2
                exit 1
                ;;
            esac
            printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
            printf 'ref=refs/tags/%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            printf 'ref=%s\n' "$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Enable pnpm
        run: corepack enable

      - name: Show tool versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Validate package version matches tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          if [ "v${PACKAGE_VERSION}" != "${TAG}" ]; then
            echo "package.json version ${PACKAGE_VERSION} does not match tag ${TAG}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build package
        run: pnpm run build

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm == true)
        run: npm publish --access public

      - name: Pack release artifact
        run: npm pack

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          python3 - <<'PY' "$GITHUB_OUTPUT"
          from pathlib import Path
          import os
          import re
          import sys

          tag = os.environ['TAG']
          out = Path(sys.argv[1])
          text = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = re.compile(rf'^## {re.escape(tag)}(?:\\s+-\\s+.*)?$', re.M)
          match = pattern.search(text)
          if not match:
              out.open('a', encoding='utf-8').write('found=false\\n')
              raise SystemExit(0)
          start = match.end()
          next_match = re.search(r'^##\\s+', text[start:], re.M)
          end = start + next_match.start() if next_match else len(text)
          notes = text[start:end].strip()
          notes_path = Path('release-notes.md')
          notes_path.write_text(notes + '\\n', encoding='utf-8')
          with out.open('a', encoding='utf-8') as fh:
              fh.write('found=true\\n')
              fh.write(f'path={notes_path}\\n')
          PY

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          asset=$(ls -1 *.tgz | head -n 1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
            exit 0
          fi
          if [ '${{ steps.notes.outputs.found }}' = 'true' ]; then
            gh release create "$TAG" "$asset" --title "$TAG" --notes-file '${{ steps.notes.outputs.path }}'
          else
            gh release create "$TAG" "$asset" --title "$TAG" --generate-notes
          fi
